[package]
name = "rmcp-task-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Thin HTTP wrapper around official rmcp TaskDemo (SEP-2663). TaskDock does not implement Tasks here."

[dependencies]
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
axum = "0.8"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
